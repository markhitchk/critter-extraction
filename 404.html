<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b1020">
  <meta name="robots" content="noindex">
  <title>404 — Critter Extraction</title>
  <link rel="icon" href="./icon.svg" type="image/svg+xml" sizes="any">
  <style>
    :root{color-scheme:dark;font-family:Inter,Arial,system-ui,sans-serif;background:#090b15;color:#f7f8ff}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 25% 0,#292858 0,#11152a 45%,#090b15 100%)}main{width:min(680px,100%);padding:28px;border:1px solid rgba(100,232,234,.45);border-radius:24px;background:rgba(17,21,42,.94);box-shadow:0 24px 80px rgba(0,0,0,.55)}span{color:#7ef7d4;font-size:11px;font-weight:900;letter-spacing:.18em}h1{margin:9px 0 11px;font-size:clamp(34px,7vw,58px)}p{color:#c7ccdc;line-height:1.6}a{display:inline-flex;margin-top:12px;border-radius:11px;padding:11px 15px;background:#64e8ea;color:#0b1020;text-decoration:none;font-weight:900}
  </style>
</head>
<body>
  <main>
    <span>404 · LOST IN MOONMEADOW</span>
    <h1>That trail does not exist.</h1>
    <p>The address may be old, mistyped, or moved. Returning you to the Critter Extraction error center…</p>
    <a id="fallbackHome" href="./">Return to the game</a>
  </main>
  <script>
    (function(){
      var parts=location.pathname.split('/').filter(Boolean);
      var root=location.hostname.endsWith('.github.io')&&parts.length?location.origin+'/'+parts[0]+'/':location.origin+'/';
      document.querySelector('link[rel="icon"]').href=new URL('icon.svg',root).href;
      document.getElementById('fallbackHome').href=root;
      var target=new URL('error.html',root);
      target.searchParams.set('code','404');
      target.searchParams.set('path',location.pathname+location.search+location.hash);
      location.replace(target.href);
    })();
  </script>
</body>
</html>
