<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Critter Extraction</title>
  <script>
    (() => {
      const parts = location.pathname.split('/').filter(Boolean);
      const base = location.hostname.endsWith('github.io') && parts.length
        ? `/${parts[0]}/`
        : '/';
      const target = new URL(`${base}live/`, location.origin);
      target.search = location.search;
      target.hash = location.hash;
      location.replace(target.href);
    })();
  </script>
</head>
<body>
  <p><a href="./live/">Open Critter Extraction Live</a></p>
</body>
</html>
