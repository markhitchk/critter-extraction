<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b1020">
  <meta name="robots" content="noindex">
  <title>Critter Extraction — Error</title>
  <link rel="icon" href="./icon.svg" type="image/svg+xml" sizes="any">
  <style>
    :root{color-scheme:dark;--mint:#7ef7d4;--cyan:#64e8ea;--purple:#8e82ff;--yellow:#ffd36f;--text:#f7f8ff;--muted:#aeb5cb;--line:rgba(255,255,255,.13);font-family:Inter,Arial,system-ui,sans-serif;background:#090b15;color:var(--text)}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:max(18px,env(safe-area-inset-top)) max(18px,env(safe-area-inset-right)) max(18px,env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left));background:radial-gradient(circle at 25% 0,#292858 0,#11152a 45%,#090b15 100%)}main{width:min(780px,100%);padding:clamp(22px,5vw,38px);border:1px solid rgba(100,232,234,.45);border-radius:26px;background:linear-gradient(145deg,rgba(30,34,69,.96),rgba(15,19,39,.97));box-shadow:0 30px 100px rgba(0,0,0,.62)}.eyebrow{display:block;color:var(--mint);font-size:11px;font-weight:900;letter-spacing:.18em}.code{margin:10px 0 2px;color:var(--yellow);font:900 clamp(58px,14vw,112px)/.9 Arial,sans-serif;letter-spacing:-.04em;text-shadow:0 0 32px rgba(255,211,111,.18)}h1{margin:12px 0 10px;font:800 clamp(28px,6vw,46px)/1.05 Arial,sans-serif}p{color:#cbd0df;line-height:1.65}.details{margin:20px 0;padding:14px;border:1px solid var(--line);border-radius:13px;background:#080b18;color:#dfe4f4;font:12px/1.55 ui-monospace,SFMono-Regular,Consolas,monospace;overflow-wrap:anywhere}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}button,a{border:1px solid var(--line);border-radius:11px;padding:11px 15px;background:rgba(255,255,255,.06);color:#fff;text-decoration:none;font:800 13px Inter,Arial,system-ui,sans-serif;cursor:pointer}.primary{border-color:transparent;background:linear-gradient(135deg,var(--mint),var(--cyan));color:#0b1020}.status{min-height:18px;margin-top:14px;color:var(--mint);font-size:12px;font-weight:800}@media(max-width:520px){main{border-radius:19px}.actions>*{flex:1 1 100%;justify-content:center;text-align:center}}
  </style>
</head>
<body>
  <main>
    <span class="eyebrow">HARLEY'S STUDIOS · CRITTER ERROR SYSTEM</span>
    <div class="code" id="errorCode">404</div>
    <h1 id="errorTitle">That trail does not exist.</h1>
    <p id="errorMessage">The requested page could not be found. Your local accounts and game progress have not been changed.</p>
    <div class="details" id="errorDetails"></div>
    <div class="actions">
      <a class="primary" id="homeLink" href="./">Return to Game</a>
      <button id="backBtn" type="button">Go Back</button>
      <button id="retryBtn" type="button">Retry</button>
      <button id="copyBtn" type="button">Copy Error Report</button>
    </div>
    <div class="status" id="status" aria-live="polite"></div>
  </main>
  <script>
    (function(){
      'use strict';
      var catalog={
        '400':['Request Not Understood','The browser sent a request the site could not understand. Check the address and try again.'],
        '403':['Trail Access Denied','This location is not available from the current address or hosting permissions.'],
        '404':['That Trail Does Not Exist','The requested page could not be found. Your local accounts and game progress have not been changed.'],
        '408':['The Trail Timed Out','The request took too long. Check the connection, then retry.'],
        '429':['Too Many Trail Requests','The service is receiving requests too quickly. Wait a moment, then retry.'],
        '500':['Something Broke in the Meadow','The game hit an unexpected site error. Reload once or return to the main game.'],
        '503':['The Meadow Is Resting','A required service is temporarily unavailable. The local game and account files are still safe.'],
        'OFFLINE':['You Are Offline','Reconnect to the internet for GitHub Pages and online services. Downloaded account files remain available on your device.']
      };
      var params=new URLSearchParams(location.search);
      var requested=String(params.get('code')||'500').toUpperCase();
      var code=navigator.onLine===false?'OFFLINE':(catalog[requested]?requested:'500');
      var parts=location.pathname.split('/').filter(Boolean);
      var root=location.hostname.endsWith('.github.io')&&parts.length?location.origin+'/'+parts[0]+'/':location.origin+'/';
      document.querySelector('link[rel="icon"]').href=new URL('icon.svg',root).href;
      var path=params.get('path')||document.referrer||location.href;
      var entry=catalog[code];
      var report={game:'Critter Extraction',errorCode:code,path:path,online:navigator.onLine,referrer:document.referrer||'',time:new Date().toISOString(),userAgent:navigator.userAgent};
      document.title=(code==='OFFLINE'?'Offline':code)+' — Critter Extraction';
      document.getElementById('errorCode').textContent=code;
      document.getElementById('errorTitle').textContent=entry[0];
      document.getElementById('errorMessage').textContent=entry[1];
      document.getElementById('errorDetails').textContent='ERROR: CE-WEB-'+code+'\nPATH: '+path+'\nONLINE: '+String(navigator.onLine)+'\nTIME: '+report.time;
      document.getElementById('homeLink').href=root;
      document.getElementById('backBtn').onclick=function(){history.length>1?history.back():location.assign(root);};
      document.getElementById('retryBtn').onclick=function(){code==='404'?location.assign(root):location.reload();};
      document.getElementById('copyBtn').onclick=function(){
        var text=JSON.stringify(report,null,2),status=document.getElementById('status');
        var fallback=function(){var area=document.createElement('textarea');area.value=text;area.style.position='fixed';area.style.opacity='0';document.body.appendChild(area);area.select();document.execCommand('copy');area.remove();status.textContent='Error report copied.';};
        if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(text).then(function(){status.textContent='Error report copied.';},fallback);else fallback();
      };
      window.addEventListener('online',function(){document.getElementById('status').textContent='Connection restored. You can retry now.';});
      window.addEventListener('offline',function(){document.getElementById('status').textContent='Connection lost. Local account data is unchanged.';});
    })();
  </script>
</body>
</html>
