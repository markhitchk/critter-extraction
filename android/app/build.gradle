plugins {
    id 'com.android.application'
}

android {
    namespace 'com.harleystudios.critterextraction'
    compileSdk = 36

    defaultConfig {
        // Compatibility package intentionally differs from the first native-alpha APK so
        // Android can install this build cleanly even if the earlier CI debug signature
        // is still present on the phone.
        applicationId = 'com.harleystudios.critterextraction.mobile'
        minSdk = 34
        targetSdk = 36
        versionCode = 231
        versionName = '0.23.1-native-compat'
    }

    sourceSets {
        main {
            // Bundle the existing Critter Extraction asset library into the APK.
            // The native runtime never executes the site's HTML or JavaScript.
            assets.srcDirs = ['src/main/assets', '../../live/assets']
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix = '.debug'
            versionNameSuffix = '-debug'
        }
        release {
            minifyEnabled = false
            shrinkResources = false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
