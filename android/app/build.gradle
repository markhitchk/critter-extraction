plugins { id 'com.android.application' }

def releaseSigning = [
    storeFile: System.getenv('CRITTER_ANDROID_KEYSTORE_PATH'),
    storePassword: System.getenv('CRITTER_ANDROID_KEYSTORE_PASSWORD'),
    keyAlias: System.getenv('CRITTER_ANDROID_KEY_ALIAS'),
    keyPassword: System.getenv('CRITTER_ANDROID_KEY_PASSWORD')
]
def hasReleaseSigning = releaseSigning.values().every { value -> value != null && !value.isBlank() }

android {
    namespace 'com.harleystudios.critterextraction'
    compileSdk = 36
    defaultConfig {
        applicationId = 'com.harleystudios.critterextraction.mobile'
        minSdk = 34
        targetSdk = 36
        versionCode = 410
        versionName = '0.41.0-native-3d-alpha'
    }
    sourceSets { main { assets.srcDirs = ['src/main/assets', '../../live/assets'] } }
    buildFeatures { buildConfig = true }
    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile = file(releaseSigning.storeFile)
                storePassword = releaseSigning.storePassword
                keyAlias = releaseSigning.keyAlias
                keyPassword = releaseSigning.keyPassword
            }
        }
    }
    buildTypes {
        debug {
            applicationIdSuffix = '.debug'
            versionNameSuffix = '-debug'
        }
        release {
            minifyEnabled = false
            shrinkResources = false
            if (hasReleaseSigning) signingConfig = signingConfigs.release
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies {
    implementation 'com.caverock:androidsvg:1.3'
    implementation 'com.infobip:google-webrtc:1.0.45036'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
