import java.util.Base64

plugins { id 'com.android.application' }

def encodedDevKey = file("${rootDir}/dev-signing/critter-dev.keystore.b64")
def generatedSigningDir = file("${buildDir}/generated-signing")
def generatedDevKey = file("${generatedSigningDir}/critter-dev.keystore")
if (encodedDevKey.exists() && !generatedDevKey.exists()) { generatedSigningDir.mkdirs(); generatedDevKey.bytes = Base64.getDecoder().decode(encodedDevKey.text.trim()) }

android {
    namespace 'com.harleystudios.critterextraction'
    compileSdk = 36
    defaultConfig {
        applicationId = 'com.harleystudios.critterextraction.mobile'
        minSdk = 34
        targetSdk = 36
        versionCode = 300
        versionName = '0.30.0-native-3d-alpha'
    }
    sourceSets { main { assets.srcDirs = ['src/main/assets', '../../live/assets'] } }
    signingConfigs { debugStable { storeFile generatedDevKey; storePassword 'critterdev2026'; keyAlias 'critterdev'; keyPassword 'critterdev2026' } }
    buildTypes {
        debug { applicationIdSuffix = '.debug'; versionNameSuffix = '-debug'; signingConfig = signingConfigs.debugStable }
        release { minifyEnabled = false; shrinkResources = false }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies { implementation 'com.caverock:androidsvg:1.3' }
