name: Feature request
description: Suggest a focused improvement for Critter Extraction
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Describe one focused improvement. For unrelated ideas, open separate issues so each change can be reviewed and tracked clearly.
  - type: input
    id: summary
    attributes:
      label: Feature summary
      placeholder: Add a waiting-room ready indicator for co-op players
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: System
      options:
        - Accounts and profiles
        - Inventory, stash, and loadouts
        - Gameplay and objectives
        - Multiplayer and room links
        - Enemy AI
        - Maps and quests
        - Rendering and graphics
        - User interface and accessibility
        - Touch and mobile controls
        - Invite and reset pages
        - Portable build
        - Development tools
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem this solves
      placeholder: Explain the current limitation or player need.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Proposed behavior
      placeholder: Explain how the feature should work from the player's point of view.
    validations:
      required: true
  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility considerations
      description: Note any save, multiplayer, public-URL, browser, or portable-build requirements.
  - type: checkboxes
    id: scope
    attributes:
      label: Scope confirmation
      options:
        - label: This request describes one focused feature.
          required: true
