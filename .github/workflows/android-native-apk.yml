name: Native Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - 'live/assets/**'
      - '.github/workflows/android-native-apk.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'live/assets/**'
      - '.github/workflows/android-native-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    name: Android 14+ APK
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Android SDK 36
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          fi
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;36.0.0'

      - name: Build installable debug APK
        working-directory: android
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK signature and bundled assets
        shell: bash
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          "$SDK_ROOT/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          unzip -l "$APK" | grep -q 'assets/characters/puppy.svg'
          unzip -l "$APK" | grep -q 'assets/weapons/pea_popper.svg'
          unzip -l "$APK" | grep -q 'assets/items/medkit.svg'
          sha256sum "$APK" | tee android/app/build/outputs/apk/debug/SHA256SUMS.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Critter-Extraction-v0.24.0-Android14-native-mobile-debug
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
