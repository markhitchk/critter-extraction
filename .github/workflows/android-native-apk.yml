name: Native Android APK

on:
  workflow_dispatch:
  push:
    paths: ['android/**','live/assets/**','live/core/rendering/**','.github/workflows/android-native-apk.yml']
  pull_request:
    paths: ['android/**','live/assets/**','live/core/rendering/**','.github/workflows/android-native-apk.yml']

permissions: { contents: read }

jobs:
  build-apk:
    name: Android 14+ Live-Faithful Native 3D APK
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: JDK 17
        uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - name: Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '9.5.0' }
      - name: Android SDK 36
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"; fi
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;36.0.0'
      - name: Build installable live-faithful native 3D debug APK
        working-directory: android
        run: gradle :app:assembleDebug --stacktrace
      - name: Verify APK and live-faithful native payload
        shell: bash
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          unzip -l "$APK" | grep -q 'assets/characters/puppy.svg'
          unzip -l "$APK" | grep -q 'assets/loading/cinematic-gameplay-fullhd.webp'
          unzip -l "$APK" | grep -q 'assets/branding/HTG.png'
          unzip -l "$APK" | grep -q 'assets/native/source-map.json'
          unzip -l "$APK" | grep -q 'classes.dex'
          APKSIGNER="$(find "${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}/build-tools" -type f -name apksigner | sort | tail -n1)"
          "$APKSIGNER" verify --verbose "$APK"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Critter-Extraction-v0.31.0-Android14-live-faithful-native-3D-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
