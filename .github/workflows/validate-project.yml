name: Validate project

on:
  push:
    branches:
      - main
      - maintenance/full-project-organization
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: live
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: live/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build generated compatibility files
        run: |
          npm run build:styles
          npm run build:portable

      - name: Validate project
        run: npm run validate

      - name: Verify generated files are committed
        run: git diff --exit-code -- styles.css START_HERE.html portable/START_HERE.html
