name: Repair VS respawn loader cache

on:
  push:
    branches:
      - agent/fix-vs-multiplayer-respawn
    paths:
      - .github/workflows/fix-vs-respawn-loader-cache.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out hotfix branch
        uses: actions/checkout@v7
        with:
          ref: agent/fix-vs-multiplayer-respawn
      - name: Set canonical loader token
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('live/index.html')
          text = path.read_text(encoding='utf-8')
          updated, count = re.subn(
              r'core/loader/game-loader\.js\?v=[^"\']+',
              'core/loader/game-loader.js?v=0.22.0',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit(f'expected one loader reference, found {count}')
          path.write_text(updated, encoding='utf-8')
          PY
      - name: Commit repaired index
        run: |
          if git diff --quiet -- live/index.html; then
            echo "Loader token already canonical"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add live/index.html
          git commit -m "Fix canonical loader cache token"
          git push
