name: Apply LIVE multiplayer UI

on:
  push:
    paths:
      - .github/workflows/apply-live-multiplayer-ui.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch cache URL and validate LIVE transforms
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('live/index.html')
          source = path.read_text(encoding='utf-8')
          target = './core/loader/game-loader.js?v=2026-08-03-multiplayer-chat-ping-2'
          updated, count = re.subn(
              r'\./core/loader/game-loader\.js\?v=[^"\s]+',
              target,
              source,
              count=1,
          )
          if count != 1:
              raise SystemExit('Could not find exactly one LIVE loader script URL')
          path.write_text(updated, encoding='utf-8')
          PY

          node --check live/core/loader/game-loader.js
          node --check live/core/loader/live-arena-patch-1.js
          node --check live/core/loader/live-arena-patch-2.js
          node --check live/core/loader/live-arena-patch-3.js
          node --check live/core/loader/live-multiplayer-ui-patch.js

          cat > /tmp/validate-live-patches.cjs <<'NODE'
          const fs = require('fs');
          global.window = global;
          window.__CRITTER_ARENA_PATCHES__ = [];
          function one(source,name,pattern,replacement,required=true){
            const flags=pattern.flags.includes('g')?pattern.flags:pattern.flags+'g';
            const matches=[...source.matchAll(new RegExp(pattern.source,flags))];
            if(name==='hide arena beacon'&&!matches.length)return source;
            if(name==='dynamic match badge'&&matches.length)return source.replace(new RegExp(pattern.source,flags),(...args)=>typeof replacement==='function'?replacement(...args):replacement);
            if(matches.length!==1){if(required)throw new Error(`LIVE patch ${matches.length?'ambiguous':'missing'}: ${name}`);return source;}
            return source.replace(pattern,(...args)=>typeof replacement==='function'?replacement(...args):replacement);
          }
          function all(source,name,pattern,replacement,required=true){
            const flags=pattern.flags.includes('g')?pattern.flags:pattern.flags+'g';
            const matches=[...source.matchAll(new RegExp(pattern.source,flags))];
            if(!matches.length){if(required)throw new Error(`LIVE patch missing: ${name}`);return source;}
            return source.replace(new RegExp(pattern.source,flags),()=>replacement);
          }
          window.__CRITTER_PATCH_UTILS__={one,all};
          require(process.cwd() + '/live/core/loader/live-arena-patch-1.js');
          require(process.cwd() + '/live/core/loader/live-arena-patch-2.js');
          require(process.cwd() + '/live/core/loader/live-arena-patch-3.js');
          require(process.cwd() + '/live/core/loader/live-multiplayer-ui-patch.js');
          let source=fs.readFileSync('live/core/game/game-core.js','utf8');
          for(const patch of window.__CRITTER_ARENA_PATCHES__)source=patch(source);
          fs.writeFileSync('/tmp/game-core-live-transformed.js',source);
          for(const required of ['multiplayerChatHud','PING ${multiplayerPingLabel()}']){
            if(!source.includes(required))throw new Error(`Transformed source missing ${required}`);
          }
          console.log(`Validated ${window.__CRITTER_ARENA_PATCHES__.length} LIVE patches`);
          NODE

          node /tmp/validate-live-patches.cjs
          node --check /tmp/game-core-live-transformed.js
          grep -q 'game-loader.js?v=2026-08-03-multiplayer-chat-ping-2' live/index.html

      - name: Commit deployment and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add live/index.html
          if ! git diff --cached --quiet; then
            git commit -m "Deploy LIVE multiplayer chat ping and VS privacy"
          fi
          git rm .github/workflows/apply-live-multiplayer-ui.yml
          git commit -m "Remove one-use multiplayer deployment workflow"
          git push origin HEAD:main

