name: Clean channel root

on:
  push:
    branches:
      - agent/clean-channel-root
    paths:
      - .github/workflows/clean-channel-root.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: clean-channel-root-${{ github.ref }}
  cancel-in-progress: false

jobs:
  clean:
    name: Remove duplicate root game build
    runs-on: ubuntu-latest
    steps:
      - name: Check out working branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Keep only repository controls and channel builds
        shell: bash
        run: |
          set -euo pipefail

          rm -rf \
            assets \
            core \
            docs \
            invite \
            js \
            media \
            portable \
            preview \
            reset \
            security \
            tools

          rm -f \
            CHANGELOG.md \
            START_HERE.html \
            error.html \
            invite.html \
            package-lock.json \
            package.json \
            styles.css

          cat > index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1">
            <title>Critter Extraction</title>
            <meta http-equiv="refresh" content="0;url=./live/">
            <script>
              (() => {
                const target = new URL('./live/', location.href);
                target.search = location.search;
                target.hash = location.hash;
                location.replace(target.href);
              })();
            </script>
            <style>
              :root{color-scheme:dark;font-family:system-ui,sans-serif;background:#080b18;color:#f7fbff}
              body{min-height:100vh;margin:0;display:grid;place-items:center;text-align:center;padding:24px;box-sizing:border-box}
              main{max-width:620px;padding:28px;border:1px solid rgba(126,247,212,.35);border-radius:20px;background:#10162a}
              a{color:#7ef7d4;font-weight:800}
              nav{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-top:20px}
            </style>
          </head>
          <body>
            <main>
              <h1>Opening Critter Extraction Live</h1>
              <p>The main site now uses independent release channels.</p>
              <p><a href="./live/">Open the Live game</a></p>
              <nav aria-label="Build channels">
                <a href="./live/">Live</a>
                <a href="./prerelease/">Pre-Release</a>
                <a href="./testing/">Testing</a>
                <a href="./tech-preview/">Tech Preview</a>
              </nav>
            </main>
          </body>
          </html>
          HTML

          cat > 404.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1">
            <title>Critter Extraction</title>
            <script>
              (() => {
                const parts = location.pathname.split('/').filter(Boolean);
                const base = location.hostname.endsWith('github.io') && parts.length
                  ? `/${parts[0]}/`
                  : '/';
                const target = new URL(`${base}live/`, location.origin);
                target.search = location.search;
                target.hash = location.hash;
                location.replace(target.href);
              })();
            </script>
          </head>
          <body>
            <p><a href="./live/">Open Critter Extraction Live</a></p>
          </body>
          </html>
          HTML

          test -f live/index.html
          test -f prerelease/index.html
          test -f testing/index.html
          test -f tech-preview/index.html

      - name: Commit cleaned root layout
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "Root layout is already clean."
            exit 0
          fi

          git commit -m "Remove duplicate root game build"
          git push origin "HEAD:${GITHUB_REF_NAME}"
