name: Remove obsolete branches

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cleanup-obsolete-branches.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Delete merged and superseded branches
        shell: bash
        run: |
          for branch in \
            fix/live-security-ban-scope \
            fix/live-vs-arena-and-fair-play \
            fix/live-vs-arena-multiplayer
          do
            git push origin --delete "$branch" || true
          done

      - name: Remove this one-use workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/cleanup-obsolete-branches.yml
          git commit -m "Remove obsolete branch cleanup workflow"
          git push
