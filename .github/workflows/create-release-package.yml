name: Create release package

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: live
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: live/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build compatibility files
        run: |
          npm run build:styles
          npm run build:portable

      - name: Validate release input
        run: npm run validate

      - name: Create release ZIP
        run: node tools/create-release-package.mjs

      - name: Upload release package
        uses: actions/upload-artifact@v7
        with:
          name: critter-extraction-v0.22.0
          path: live/critter-extraction-v0.22.0.zip
          if-no-files-found: error
          retention-days: 30
