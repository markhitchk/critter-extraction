name: Fix LIVE loader cache

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/live-loader-cache-bust.yml

permissions:
  contents: write

jobs:
  patch-live-loader:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch LIVE loader and force fresh browser URLs
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          stamp = '2026-08-03-live-arena-fix-3'

          index = Path('live/index.html')
          text = index.read_text(encoding='utf-8')
          old_loader = './core/loader/game-loader.js?v=0.22.0'
          new_loader = f'./core/loader/game-loader.js?v={stamp}'
          if old_loader in text:
              text = text.replace(old_loader, new_loader)
          elif new_loader not in text:
              raise SystemExit('Could not find LIVE loader script URL in live/index.html')
          index.write_text(text, encoding='utf-8')

          loader = Path('live/core/loader/game-loader.js')
          text = loader.read_text(encoding='utf-8')
          text = text.replace(
              "const BASE='./core/loader/game-loader-base.js?v=2026-08-03-live-arena-fix-2';",
              f"const BASE='./core/loader/game-loader-base.js?v={stamp}';"
          )
          old_modules = "const MODULES=['./core/loader/live-arena-patch-1.js','./core/loader/live-arena-patch-2.js','./core/loader/live-arena-patch-3.js'];"
          new_modules = f"const MODULES=['./core/loader/live-arena-patch-1.js?v={stamp}','./core/loader/live-arena-patch-2.js?v={stamp}','./core/loader/live-arena-patch-3.js?v={stamp}'];"
          if old_modules in text:
              text = text.replace(old_modules, new_modules)
          elif new_modules not in text:
              raise SystemExit('Could not find LIVE patch module list')
          loader.write_text(text, encoding='utf-8')

          patch = Path('live/core/loader/live-arena-patch-1.js')
          text = patch.read_text(encoding='utf-8')
          old_badge = "source = one(source, 'dynamic match badge',"
          new_badge = "source = all(source, 'dynamic match badge',"
          if old_badge in text:
              text = text.replace(old_badge, new_badge, 1)
          elif new_badge not in text:
              raise SystemExit('Could not find dynamic match badge patch')
          patch.write_text(text, encoding='utf-8')
          PY

      - name: Commit cache-safe LIVE fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add live/index.html live/core/loader/game-loader.js live/core/loader/live-arena-patch-1.js
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "LIVE cache fix already applied"
            exit 0
          fi
          git commit -m "Force fresh LIVE arena loader"
          git push
