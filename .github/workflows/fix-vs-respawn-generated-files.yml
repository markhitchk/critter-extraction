name: Refresh VS respawn generated files

on:
  push:
    branches:
      - agent/fix-vs-multiplayer-respawn
    paths:
      - .github/workflows/fix-vs-respawn-generated-files.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: live
    steps:
      - name: Check out hotfix branch
        uses: actions/checkout@v7
        with:
          ref: agent/fix-vs-multiplayer-respawn
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: live/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Rebuild generated compatibility files
        run: |
          npm run build:styles
          npm run build:portable
      - name: Commit generated files
        run: |
          cd ..
          if git diff --quiet -- live/styles.css live/START_HERE.html live/portable/START_HERE.html; then
            echo "Generated files already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add live/styles.css live/START_HERE.html live/portable/START_HERE.html
          git commit -m "Refresh generated compatibility files"
          git push
