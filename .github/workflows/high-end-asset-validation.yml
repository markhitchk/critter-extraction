name: High-End Asset Validation

on:
  pull_request:
    paths:
      - 'assets/manifest/**'
      - 'assets/models/**'
      - 'assets/textures/**'
      - 'assets/animations/**'
      - 'core/game/game-core.js'
      - 'core/rendering/high-end-asset-registry.js'
      - 'core/rendering/high-end-glb-runtime.js'
      - 'core/rendering/high-end-world-patches.js'
      - 'core/rendering/high-end-rock-patches.js'
      - 'core/rendering/high-end-ground-patches.js'
      - 'core/rendering/high-end-terrain-patches.js'
      - 'core/rendering/high-end-lod-patches.js'
      - 'core/rendering/high-end-acorn-patches.js'
      - 'core/rendering/model-library.js'
      - 'tools/check-3d-assets.mjs'
      - 'tools/check-high-end-runtime.mjs'
      - 'tools/check-high-end-rock-runtime.mjs'
      - 'tools/check-high-end-ground-runtime.mjs'
      - 'tools/check-high-end-terrain-runtime.mjs'
      - 'tools/check-high-end-lod-runtime.mjs'
      - 'tools/check-high-end-acorn-runtime.mjs'
      - '.github/workflows/high-end-asset-validation.yml'
  push:
    branches:
      - 'agent/high-end-3d-asset-overhaul'
    paths:
      - 'assets/manifest/**'
      - 'assets/models/**'
      - 'assets/textures/**'
      - 'assets/animations/**'
      - 'core/game/game-core.js'
      - 'core/rendering/high-end-asset-registry.js'
      - 'core/rendering/high-end-glb-runtime.js'
      - 'core/rendering/high-end-world-patches.js'
      - 'core/rendering/high-end-rock-patches.js'
      - 'core/rendering/high-end-ground-patches.js'
      - 'core/rendering/high-end-terrain-patches.js'
      - 'core/rendering/high-end-lod-patches.js'
      - 'core/rendering/high-end-acorn-patches.js'
      - 'core/rendering/model-library.js'
      - 'tools/check-3d-assets.mjs'
      - 'tools/check-high-end-runtime.mjs'
      - 'tools/check-high-end-rock-runtime.mjs'
      - 'tools/check-high-end-ground-runtime.mjs'
      - 'tools/check-high-end-terrain-runtime.mjs'
      - 'tools/check-high-end-lod-runtime.mjs'
      - 'tools/check-high-end-acorn-runtime.mjs'
      - '.github/workflows/high-end-asset-validation.yml'

permissions:
  contents: read

jobs:
  validate-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check authored runtime syntax
        run: |
          node --check core/rendering/high-end-asset-registry.js
          node --check core/rendering/high-end-glb-runtime.js
          node --check core/rendering/high-end-world-patches.js
          node --check core/rendering/high-end-rock-patches.js
          node --check core/rendering/high-end-ground-patches.js
          node --check core/rendering/high-end-terrain-patches.js
          node --check core/rendering/high-end-lod-patches.js
          node --check core/rendering/high-end-acorn-patches.js
          node --check core/rendering/model-library.js
          node --check tools/check-high-end-runtime.mjs
          node --check tools/check-high-end-rock-runtime.mjs
          node --check tools/check-high-end-ground-runtime.mjs
          node --check tools/check-high-end-terrain-runtime.mjs
          node --check tools/check-high-end-lod-runtime.mjs
          node --check tools/check-high-end-acorn-runtime.mjs

      - name: Validate authored runtime integration
        run: |
          node tools/check-high-end-runtime.mjs
          node tools/check-high-end-rock-runtime.mjs
          node tools/check-high-end-ground-runtime.mjs
          node tools/check-high-end-terrain-runtime.mjs
          node tools/check-high-end-lod-runtime.mjs
          node tools/check-high-end-acorn-runtime.mjs

      - name: Validate high-end asset manifest
        run: node tools/check-3d-assets.mjs

      - name: Run existing asset check
        run: npm run check:assets
