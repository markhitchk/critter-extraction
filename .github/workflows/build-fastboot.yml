name: Build Fast Boot Runtime

on:
  push:
    branches:
      - main
      - 'agent/**'
    paths:
      - 'live/**'
      - 'scripts/build-fastboot.mjs'
      - 'scripts/optimize-live-index.mjs'
      - 'scripts/sanitize-fastboot-output.mjs'
      - '.github/workflows/build-fastboot.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'live/**'
      - 'scripts/build-fastboot.mjs'
      - 'scripts/optimize-live-index.mjs'
      - 'scripts/sanitize-fastboot-output.mjs'
      - '.github/workflows/build-fastboot.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fastboot-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build generated runtime
        run: node scripts/build-fastboot.mjs

      - name: Optimize live index
        run: node scripts/optimize-live-index.mjs

      - name: Normalize generated output
        run: node scripts/sanitize-fastboot-output.mjs

      - name: Validate generated JavaScript
        run: |
          node --check live/core/loader/game-loader.js
          node --check live/core/loader/live-patches.bundle.js
          node --check live/core/game/game-runtime.js
          node --check live/core/boot/project-paths.js
          git diff --check

      - name: Commit generated Fast Boot files
        run: |
          if git diff --quiet; then
            echo "Fast Boot outputs are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add live/index.html live/core/config/build-info.js live/core/loader/live-patches.bundle.js live/core/game/game-runtime.js
          git commit -m "Build generated Fast Boot runtime"
          git push origin "HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}"
