name: Portable build parity

on:
  pull_request:
    paths:
      - START_HERE.html
      - portable/**
      - core/**
      - assets/**
      - styles.css
      - tools/build-portable.mjs
      - tools/verify-portable-parity.mjs
      - package.json
      - package-lock.json
  push:
    branches:
      - main
    paths:
      - START_HERE.html
      - portable/**
      - core/**
      - assets/**
      - styles.css
      - tools/build-portable.mjs
      - tools/verify-portable-parity.mjs
      - package.json
      - package-lock.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Rebuild portable compatibility files
        run: npm run build:portable

      - name: Verify portable parity
        run: npm run check:portable

      - name: Verify portable outputs are committed
        run: git diff --exit-code -- START_HERE.html portable/START_HERE.html
