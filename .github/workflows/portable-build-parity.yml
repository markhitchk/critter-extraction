name: Portable build parity

on:
  pull_request:
    paths:
      - live/START_HERE.html
      - live/portable/**
      - live/core/**
      - live/assets/**
      - live/styles.css
      - live/tools/build-portable.mjs
      - live/tools/verify-portable-parity.mjs
      - live/package.json
      - live/package-lock.json
  push:
    branches:
      - main
    paths:
      - live/START_HERE.html
      - live/portable/**
      - live/core/**
      - live/assets/**
      - live/styles.css
      - live/tools/build-portable.mjs
      - live/tools/verify-portable-parity.mjs
      - live/package.json
      - live/package-lock.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parity:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: live
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: live/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Rebuild portable compatibility files
        run: npm run build:portable

      - name: Verify portable parity
        run: npm run check:portable

      - name: Verify portable outputs are committed
        run: git diff --exit-code -- START_HERE.html portable/START_HERE.html
