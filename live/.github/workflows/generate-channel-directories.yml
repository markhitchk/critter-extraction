name: Generate channel directories

on:
  push:
    branches:
      - agent/channel-directories
    paths:
      - .github/workflows/generate-channel-directories.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generate-channel-directories-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    name: Copy complete project into channel directories
    runs-on: ubuntu-latest

    steps:
      - name: Check out working branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Generate independent channel copies
        shell: bash
        run: |
          set -euo pipefail

          channels=(live prerelease testing tech-preview)
          snapshot="$(mktemp -d)/project-root"
          mkdir -p "$snapshot"

          rsync -a ./ "$snapshot/" \
            --exclude='.git/' \
            --exclude='live/' \
            --exclude='prerelease/' \
            --exclude='testing/' \
            --exclude='tech-preview/'

          for channel in "${channels[@]}"; do
            rm -rf "$channel"
            mkdir -p "$channel"
            rsync -a "$snapshot/" "$channel/"

            test -f "$channel/index.html"
            test -d "$channel/assets"
            test -d "$channel/core"
            test -d "$channel/js"
            test -f "$channel/styles.css"
          done

      - name: Commit generated channel directories
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f -- live prerelease testing tech-preview

          if git diff --cached --quiet; then
            echo "Channel directories are already current."
            exit 0
          fi

          git commit -m "Add independent GitHub Pages channel copies"
          git push origin "HEAD:${GITHUB_REF_NAME}"
