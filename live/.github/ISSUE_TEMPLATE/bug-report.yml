name: Bug report
description: Report a reproducible Critter Extraction problem
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Critter Extraction. Do not include account XML, room invite payloads, IP addresses, authentication tokens, or private profile data.
  - type: input
    id: version
    attributes:
      label: Game version
      description: The version shown in the game header or support report.
      placeholder: v0.22.0
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Affected system
      options:
        - Startup or loading
        - Account or save data
        - Inventory, stash, or loadout
        - Solo gameplay
        - Multiplayer or room links
        - Enemy AI
        - Rendering or graphics
        - Touch or mobile controls
        - Invite or reset page
        - Portable build
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
      placeholder: Include the exact screen, action, and visible result.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open...
        2. Select...
        3. Observe...
    validations:
      required: true
  - type: textarea
    id: report
    attributes:
      label: Sanitized support report
      description: Paste the game's support report when available. Review it before submitting.
      render: json
  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: Chrome 150 on Chromebook, 1366×768
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed account XML, inventory contents, room payloads, IP addresses, tokens, and other private data.
          required: true
